name: 'CyberArk Conjur Secret Fetcher Action'
description: 'Securely retrieve a secret from CyberArk Conjur Secrets Manager and present to your action as a masked environment variable'
author: 'CyberArk'
inputs:
  url:
    description: 'The URL for CyberArk Conjur endpoint'
    required: true
  account:
    description: 'The account name of your CyberArk Conjur instance'
    required: true
  host_id:
    description: 'The Host ID to be used for authentication to CyberArk Conjur Secrets Manager e.g. host/github-action'
    required: false
  api_key:
    description: 'The API Key associated with the given Host ID'
    required: false
  authn_token_file:
    description: 'The file path for the Conjur auth token'
    required: false
  authn_id:
    description: 'The Service ID of JWT Authenticator'
    required: false
  secrets:
    description: 'A semi-colon delimited list of secrets to retrieve. See README for more details.'
    required: true
  certificate:
    description: 'The Self-Signed SSL Certificate for your CyberArk Conjur instance'
  allow_insecure_connections:
    description: 'Allow non-HTTPS (HTTP) connections to the Conjur endpoint. Not recommended for production use.'
    required: false
    default: 'false'
  audience:
    description: 'Custom "aud" claim value in the JWT'
    required: false
  authn_cert_id:
    description: 'The Service ID of the Certificate Authenticator for mTLS-based authentication'
    required: false
  client_cert:
    description: 'The client certificate in PEM format for certificate-based (mTLS) authentication'
    required: false
  client_key:
    description: 'The client private key in PEM format for certificate-based (mTLS) authentication'
    required: false
runs:
  using: 'docker'
  image: 'docker://cyberark/conjur-action:3.0.1'
  args:
    - ${{ inputs.url }}
    - ${{ inputs.account }}
    - ${{ inputs.host_id }}
    - ${{ inputs.api_key }}
    - ${{ inputs.authn_token_file }}
    - ${{ inputs.authn_id }}
    - ${{ inputs.secrets }}
    - ${{ inputs.certificate }}
    - ${{ inputs.allow_insecure_connections }}
    - ${{ inputs.audience }}
    - ${{ inputs.authn_cert_id }}
    - ${{ inputs.client_cert }}
    - ${{ inputs.client_key }}
branding:
  icon: 'lock'
  color: 'blue'
